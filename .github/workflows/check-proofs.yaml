name: Check Proofs
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

########################################################################
## CONFIGURATION
##
## Key variables:
##
## AGDA_VERSION picks the version of Agda to use to build the library.
##
## STDLIB_VERSION picks the version of the stdlib to pull.
##
## CATEGORIES_REF picks the commit/branch/tag of agda-categories to pull.
##
## The rest:
##
## The AGDA variable specifies the command to use to build the library.
## It currently passes the flag `-Werror` to ensure maximal compliance
## with e.g. not relying on deprecated definitions.
## The rest are some arbitrary runtime arguments that shape the way Agda
## allocates and garbage collects memory. It should make things faster.
## Limits can be bumped if the builds start erroring with out of memory
## errors.
##
########################################################################

env:
  AGDA_VERSION: "2.8.0"
  STDLIB_VERSION: "2.4"
  CATEGORIES_REF: "master"

  AGDA: agda --auto-inline -Werror +RTS -M6G -H3.5G -A128M -RTS -i . -i src/

permissions:
  contents: read

# Allow one concurrent deployment, but let a running one finish so we
# never interrupt an in-progress Pages deployment.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  check:
    name: Check src/index.agda
    runs-on: ubuntu-latest
    steps:

      # By default github actions do not pull the repo
      - name: Checkout agda-bats4cats
        uses: actions/checkout@v7

########################################################################
## INSTALLATION STEPS
########################################################################

      - name: Install Agda
        uses: agda/agda-setup-action@v1
        id: setup
        with:
          agda-version: ${{ env.AGDA_VERSION }}
          agda-stdlib-version: ${{ env.STDLIB_VERSION }}

      # agda-categories is not a released library we can ask the setup
      # action for, so we clone it and register it with Agda by hand.
      - name: Install agda-categories
        run: |
          git clone --depth 1 --branch "${CATEGORIES_REF}" \
            https://github.com/agda/agda-categories "${HOME}/agda-categories"
          echo "${HOME}/agda-categories/agda-categories.agda-lib" \
            >> "${{ steps.setup.outputs.agda-dir }}/libraries"

########################################################################
## CACHING: RESTORE
########################################################################

      # This caching step allows us to save a lot of building time by
      # saving the previous build.
      - name: Restore cache
        uses: actions/cache/restore@v6
        id: cache
        with:
          path: |
            ${{ steps.setup.outputs.agda-dir }}
            ${{ github.workspace }}/_build
            ~/agda-categories/_build
          key: ${{ runner.os }}-agda-${{ env.AGDA_VERSION }}-categories-${{ env.CATEGORIES_REF }}-commit-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-agda-${{ env.AGDA_VERSION }}-categories-${{ env.CATEGORIES_REF }}-

########################################################################
## TESTING
########################################################################

      - name: Check src/index.agda
        run: ${{ env.AGDA }} src/index.agda

      # Note that if you want to deploy html for different versions like the
      # standard library does, you will need to be a bit more subtle in this
      # step.
      - name: Generate HTML
        run: ${{ env.AGDA }} --html --html-dir html src/index.agda

      - name: Upload HTML as a Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: html

########################################################################
## CACHING: SAVE
########################################################################

      # This caching step allows us to save a lot of building time by
      # saving the previous build.
      - name: Save cache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: |
            ${{ steps.setup.outputs.agda-dir }}
            ${{ github.workspace }}/_build
            ~/agda-categories/_build
          key: ${{ steps.cache.outputs.cache-primary-key }}

########################################################################
## DEPLOYMENT
##
## Deploying to GitHub Pages needs a dedicated job with its own
## permissions and environment; see
## https://github.com/actions/deploy-pages#readme
##
## This requires "Build and deployment > Source" to be set to
## "GitHub Actions" in the repository's Pages settings.
##
########################################################################

  deploy:
    name: Deploy HTML to GitHub Pages
    # Only deploy if the build follows from pushing to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
